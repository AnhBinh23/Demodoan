<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đặt hàng thành công — MusicStore</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<div id="header-placeholder"></div>

<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="text-align:center;max-width:480px">
    <div style="width:90px;height:90px;background:rgba(76,175,128,0.12);border:2px solid var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 1.5rem">✓</div>
    <h1 style="font-family:'Playfair Display',serif;font-size:2rem;color:var(--green);margin-bottom:0.5rem">Đặt hàng thành công!</h1>
    <p style="color:var(--muted);margin-bottom:0.5rem">Cảm ơn bạn đã mua hàng tại MusicStore 🎵</p>
    <p style="font-size:0.88rem;color:var(--muted);margin-bottom:2rem" id="orderInfo"></p>

    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem;margin-bottom:1.5rem;text-align:left" id="orderDetail">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <a href="orders.html" class="btn btn-primary">Xem đơn hàng</a>
      <a href="../index.html" class="btn btn-outline">Tiếp tục mua sắm</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script>
  renderHeader('');
  renderFooter();

  const orderId = new URLSearchParams(location.search).get('id');
  document.getElementById('orderInfo').textContent = `Mã đơn hàng: #${orderId}`;

  async function loadOrder() {
    if (!orderId) return;
    try {
      const order = await Orders.getById(orderId);
      document.getElementById('orderDetail').innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:0.88rem;margin-bottom:0.5rem">
          <span style="color:var(--muted)">Người nhận:</span>
          <span style="font-weight:500">${order.receiver_name}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.88rem;margin-bottom:0.5rem">
          <span style="color:var(--muted)">Số điện thoại:</span>
          <span>${order.receiver_phone}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.88rem;margin-bottom:0.5rem">
          <span style="color:var(--muted)">Địa chỉ:</span>
          <span>${order.shipping_address}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.88rem;margin-bottom:0.5rem">
          <span style="color:var(--muted)">Thanh toán:</span>
          <span>${order.payment_method==='cod'?'COD - Tiền mặt':'Chuyển khoản'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.95rem;padding-top:0.6rem;border-top:1px solid var(--border);font-weight:600">
          <span>Tổng tiền:</span>
          <span style="color:var(--gold)">${formatPrice(order.total_amount)}</span>
        </div>`;
    } catch {}
  }

  loadOrder();
</script>
</body>
</html>
