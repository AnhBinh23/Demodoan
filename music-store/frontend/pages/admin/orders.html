<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý đơn hàng — Admin</title>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>

<div id="sidebar-placeholder"></div>

<main class="admin-main">
  <div class="page-header">
    <h1>Đơn hàng</h1>
    <p>Quản lý và cập nhật trạng thái đơn hàng</p>
  </div>

  <!-- Filter tabs -->
  <div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
    <button class="btn btn-primary btn-sm active-tab" onclick="filterTab('')"     id="tab-all">Tất cả</button>
    <button class="btn btn-outline btn-sm"             onclick="filterTab('pending')"    id="tab-pending">Chờ xác nhận</button>
    <button class="btn btn-outline btn-sm"             onclick="filterTab('confirmed')"  id="tab-confirmed">Đã xác nhận</button>
    <button class="btn btn-outline btn-sm"             onclick="filterTab('shipping')"   id="tab-shipping">Đang giao</button>
    <button class="btn btn-outline btn-sm"             onclick="filterTab('delivered')"  id="tab-delivered">Đã giao</button>
    <button class="btn btn-outline btn-sm"             onclick="filterTab('cancelled')"  id="tab-cancelled">Đã hủy</button>
  </div>

  <div class="admin-table-wrap">
    <table>
      <thead>
        <tr><th>#ID</th><th>Khách hàng</th><th>Địa chỉ</th><th>Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th>Ngày đặt</th><th>Thao tác</th></tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="8"><div class="loading"><div class="spinner"></div></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- MODAL CHI TIẾT & CẬP NHẬT TRẠNG THÁI -->
<div class="modal-overlay" id="orderModal" style="display:none">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <h3 id="modalTitle">Chi tiết đơn hàng</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Đóng</button>
      <button class="btn btn-primary" id="updateBtn" onclick="updateStatus()">Cập nhật trạng thái</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../../js/api.js"></script>
<script src="sidebar.js"></script>
<script>
  renderSidebar('orders');
  let allOrders = [], currentOrderId = null;

  const statusLabels = { pending:'Chờ xác nhận', confirmed:'Đã xác nhận', shipping:'Đang giao', delivered:'Đã giao', cancelled:'Đã hủy' };
  const statusClass  = { pending:'badge-pending', confirmed:'badge-confirmed', shipping:'badge-shipping', delivered:'badge-delivered', cancelled:'badge-cancelled' };
  const nextStatus   = { pending:'confirmed', confirmed:'shipping', shipping:'delivered' };

  async function loadOrders() {
    try {
      allOrders = await api.get('/orders/admin/all');
      renderTable(allOrders);
    } catch(e) { showToast(e.message, 'error'); }
  }

  function renderTable(orders) {
    const tbody = document.getElementById('ordersBody');
    if (!orders.length) { tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="icon">📦</div><p>Không có đơn hàng</p></div></td></tr>`; return; }
    tbody.innerHTML = orders.map(o => `
      <tr>
        <td style="color:var(--gold);font-weight:600">#${o.order_id}</td>
        <td><div style="font-weight:500">${o.full_name||''}</div><div style="font-size:0.78rem;color:var(--muted)">${o.receiver_phone}</div></td>
        <td style="font-size:0.82rem;color:var(--muted);max-width:160px">${o.shipping_address}</td>
        <td style="color:var(--gold);font-weight:600">${formatPrice(o.total_amount)}</td>
        <td><span class="badge ${o.payment_status==='paid'?'badge-active':'badge-pending'}">${o.payment_status==='paid'?'Đã thanh toán':'Chưa thanh toán'}</span></td>
        <td><span class="badge ${statusClass[o.status]}">${statusLabels[o.status]}</span></td>
        <td style="color:var(--muted);font-size:0.82rem">${new Date(o.created_at).toLocaleDateString('vi-VN')}</td>
        <td><button class="btn btn-outline btn-sm" onclick="viewOrder(${o.order_id})">Chi tiết</button></td>
      </tr>`).join('');
  }

  function filterTab(status) {
    document.querySelectorAll('[id^="tab-"]').forEach(b => { b.classList.remove('btn-primary'); b.classList.add('btn-outline'); });
    const tabId = status ? `tab-${status}` : 'tab-all';
    document.getElementById(tabId)?.classList.replace('btn-outline','btn-primary');
    renderTable(status ? allOrders.filter(o => o.status === status) : allOrders);
  }

  async function viewOrder(id) {
    currentOrderId = id;
    const order = allOrders.find(o => o.order_id === id);
    if (!order) return;
    const details = await api.get(`/orders/${id}`).catch(() => order);
    const items = details.details || [];

    document.getElementById('modalTitle').textContent = `Đơn hàng #${id}`;
    document.getElementById('modalContent').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.2rem">
        <div><div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;margin-bottom:0.3rem">Người nhận</div><div style="font-weight:500">${order.receiver_name}</div><div style="font-size:0.82rem;color:var(--muted)">${order.receiver_phone}</div></div>
        <div><div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;margin-bottom:0.3rem">Địa chỉ</div><div style="font-size:0.88rem">${order.shipping_address}</div></div>
        <div><div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;margin-bottom:0.3rem">Thanh toán</div><div>${order.payment_method==='cod'?'Tiền mặt (COD)':'Chuyển khoản'}</div></div>
        <div><div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;margin-bottom:0.3rem">Trạng thái hiện tại</div><span class="badge ${statusClass[order.status]}">${statusLabels[order.status]}</span></div>
      </div>
      ${items.length ? `
      <div style="background:var(--bg3);border-radius:var(--radius);padding:1rem;margin-bottom:1rem">
        ${items.map(i => `<div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:0.88rem"><span>${i.product_name} x${i.quantity}</span><span style="color:var(--gold)">${formatPrice(i.subtotal||i.price*i.quantity)}</span></div>`).join('')}
        <div style="display:flex;justify-content:space-between;padding-top:0.6rem;font-weight:600"><span>Tổng cộng</span><span style="color:var(--gold)">${formatPrice(order.total_amount)}</span></div>
      </div>` : ''}
      ${nextStatus[order.status] ? `
      <div class="form-group">
        <label class="form-label">Cập nhật trạng thái</label>
        <select class="form-select" id="newStatus">
          ${Object.entries(statusLabels).map(([k,v]) => `<option value="${k}" ${k===order.status?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>` : `<p style="color:var(--muted);font-size:0.85rem;text-align:center;padding:0.5rem">Đơn hàng này không thể thay đổi trạng thái.</p>`}
    `;
    const updateBtn = document.getElementById('updateBtn');
    updateBtn.style.display = nextStatus[order.status] ? 'flex' : 'none';
    document.getElementById('orderModal').style.display = 'flex';
  }

  async function updateStatus() {
    const newStatus = document.getElementById('newStatus')?.value;
    if (!newStatus || !currentOrderId) return;
    try {
      await api.put(`/orders/admin/${currentOrderId}/status`, { status: newStatus });
      showToast('Cập nhật trạng thái thành công!', 'success');
      closeModal(); await loadOrders();
    } catch(e) { showToast(e.message, 'error'); }
  }

  function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

  loadOrders();
</script>
</body>
</html>
