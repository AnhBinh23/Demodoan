<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý sản phẩm — Admin</title>
  <link rel="stylesheet" href="admin.css"/>
  <style>
    .upload-zone {
      border:2px dashed var(--border); border-radius:var(--radius);
      padding:1.2rem; text-align:center; cursor:pointer;
      transition:all 0.2s; position:relative; background:var(--bg3);
    }
    .upload-zone:hover { border-color:var(--gold); background:rgba(201,168,76,0.04); }
    .upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .main-preview { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:var(--radius); display:none; margin-top:0.5rem; }
    .remove-main { display:none; margin-top:0.4rem; }

    /* MULTI IMAGES */
    .multi-upload-zone {
      border:2px dashed var(--border); border-radius:var(--radius);
      padding:1rem; text-align:center; cursor:pointer;
      transition:all 0.2s; position:relative; background:var(--bg3);
    }
    .multi-upload-zone:hover { border-color:var(--gold); background:rgba(201,168,76,0.04); }
    .multi-upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .thumb-preview-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; margin-top:0.8rem;
    }
    .thumb-preview-item {
      position:relative; aspect-ratio:1;
      border-radius:var(--radius); overflow:hidden;
      border:1px solid var(--border); background:var(--bg3);
    }
    .thumb-preview-item img { width:100%; height:100%; object-fit:cover; }
    .thumb-preview-item .remove-thumb {
      position:absolute; top:3px; right:3px;
      background:rgba(0,0,0,0.65); border:none; color:#fff;
      border-radius:50%; width:20px; height:20px; font-size:0.65rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .thumb-add-btn {
      aspect-ratio:1; border:2px dashed var(--border); border-radius:var(--radius);
      background:var(--bg3); display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; cursor:pointer; color:var(--muted); transition:all 0.2s;
      position:relative;
    }
    .thumb-add-btn:hover { border-color:var(--gold); color:var(--gold); }
    .thumb-add-btn input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>

<main class="admin-main">
  <div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
    <div><h1>Sản phẩm</h1><p>Quản lý toàn bộ sản phẩm nhạc cụ</p></div>
    <button class="btn btn-primary" onclick="openModal()">+ Thêm sản phẩm</button>
  </div>

  <div class="admin-table-wrap">
    <div class="table-toolbar">
      <div class="search-input">
        <span>🔍</span>
        <input type="text" placeholder="Tìm sản phẩm..." id="searchInput" oninput="filterProducts()"/>
      </div>
      <select class="form-select" style="width:auto;padding:0.4rem 0.8rem" id="catFilter" onchange="filterProducts()">
        <option value="">Tất cả danh mục</option>
      </select>
    </div>
    <table>
      <thead>
        <tr><th>Ảnh</th><th>Tên sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr>
      </thead>
      <tbody id="productsBody">
        <tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="productModal" style="display:none">
  <div class="modal" style="max-width:620px;max-height:90vh;overflow-y:auto">
    <div class="modal-header">
      <h3 id="modalTitle">Thêm sản phẩm</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="editId"/>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Tên sản phẩm *</label>
        <input type="text" class="form-input" id="fName" placeholder="Yamaha P-45"/>
      </div>
      <div class="form-group">
        <label class="form-label">Thương hiệu</label>
        <input type="text" class="form-input" id="fBrand" placeholder="Yamaha"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Danh mục *</label>
        <select class="form-select" id="fCategory"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Giá (VNĐ) *</label>
        <input type="number" class="form-input" id="fPrice" placeholder="12500000"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Giảm giá (%)</label>
        <input type="number" class="form-input" id="fDiscount" placeholder="0" min="0" max="100"/>
      </div>
      <div class="form-group">
        <label class="form-label">Tồn kho</label>
        <input type="number" class="form-input" id="fStock" placeholder="10"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Mô tả</label>
      <textarea class="form-textarea" id="fDesc" placeholder="Mô tả sản phẩm..."></textarea>
    </div>

    <!-- ẢNH CHÍNH -->
    <div class="form-group">
      <label class="form-label">🖼️ Ảnh chính <span style="color:var(--muted);font-weight:400">(hiển thị ở danh sách)</span></label>
      <div class="upload-zone" id="mainUploadZone">
        <input type="file" id="fMainImage" accept=".jpg,.jpeg,.png,.webp" onchange="previewMainImg(this)"/>
        <div style="font-size:1.6rem;margin-bottom:0.3rem">📷</div>
        <p style="font-size:0.82rem;color:var(--muted);margin:0"><span style="color:var(--gold)">Nhấn chọn ảnh</span> từ máy tính</p>
        <p style="font-size:0.72rem;color:var(--muted);margin:0.2rem 0 0">JPG, PNG, WEBP — tối đa 5MB</p>
      </div>
      <img id="mainImgPreview" class="main-preview" alt=""/>
      <button class="btn btn-outline btn-sm remove-main" id="removeMainBtn" onclick="removeMainImg()">✕ Xóa ảnh</button>
    </div>

    <!-- ẢNH PHỤ (THUMBNAILS) -->
    <div class="form-group">
      <label class="form-label">🖼️ Ảnh phụ <span style="color:var(--muted);font-weight:400">(3-4 ảnh nhỏ bên dưới ảnh chính)</span></label>
      <div class="thumb-preview-grid" id="thumbGrid">
        <!-- Ảnh đã thêm sẽ hiện ở đây -->
        <div class="thumb-add-btn" id="addThumbBtn">
          <input type="file" accept=".jpg,.jpeg,.png,.webp" multiple onchange="addThumbImgs(this)"/>
          <span>＋</span>
        </div>
      </div>
      <p style="font-size:0.75rem;color:var(--muted);margin-top:0.5rem">Tối đa 4 ảnh phụ. Nhấn ＋ để thêm, nhấn ✕ để xóa</p>
    </div>

    <div class="form-group" id="statusGroup" style="display:none">
      <label class="form-label">Trạng thái</label>
      <select class="form-select" id="fActive">
        <option value="1">Đang bán</option>
        <option value="0">Ngừng bán</option>
      </select>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveProduct()">Lưu sản phẩm</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../../js/api.js"></script>
<script src="sidebar.js"></script>
<script>
  renderSidebar('products');
  let allProducts = [], categories = [];
  let thumbFiles = []; // Mảng lưu file ảnh phụ

  async function loadData() {
    try {
      categories = await Categories.getAll();
      const catFilter = document.getElementById('catFilter');
      const fCategory = document.getElementById('fCategory');
      categories.forEach(c => {
        catFilter.innerHTML += `<option value="${c.category_id}">${c.category_name}</option>`;
        fCategory.innerHTML += `<option value="${c.category_id}">${c.category_name}</option>`;
      });
      await loadProducts();
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function loadProducts() {
    const { products } = await Products.getAll({ limit: 100 });
    allProducts = products;
    renderTable(products);
  }

  function renderTable(products) {
    const tbody = document.getElementById('productsBody');
    if (!products.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="icon">🎵</div><p>Không có sản phẩm</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = products.map(p => `
      <tr>
        <td><div class="td-img" style="overflow:hidden">
          ${p.image_url
            ? `<img src="${p.image_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius)" onerror="this.parentElement.innerHTML='🎵'"/>`
            : '🎵'}</div></td>
        <td><div style="font-weight:500">${p.product_name}</div><div style="font-size:0.78rem;color:var(--muted)">${p.brand||''}</div></td>
        <td style="color:var(--muted)">${p.category_name}</td>
        <td style="color:var(--gold);font-weight:600">${formatPrice(p.price)}</td>
        <td><span style="color:${p.stock<5?'var(--red)':'var(--green)'}">${p.stock}</span></td>
        <td><span class="badge ${p.is_active?'badge-active':'badge-inactive'}">${p.is_active?'Đang bán':'Ngừng bán'}</span></td>
        <td style="display:flex;gap:0.4rem">
          <button class="btn btn-outline btn-sm" onclick="editProduct(${p.product_id})">✏️ Sửa</button>
          <button class="btn btn-danger btn-sm"  onclick="deleteProduct(${p.product_id},'${p.product_name.replace(/'/g,"\\'")}')">🗑</button>
        </td>
      </tr>`).join('');
  }

  function filterProducts() {
    const q   = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('catFilter').value;
    renderTable(allProducts.filter(p =>
      (!q   || p.product_name.toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q)) &&
      (!cat || p.category_id == cat)
    ));
  }

  // ẢNH CHÍNH
  function previewMainImg(input) {
    if (!input.files || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = e => {
      const preview = document.getElementById('mainImgPreview');
      preview.src = e.target.result;
      preview.style.display = 'block';
      document.getElementById('removeMainBtn').style.display = 'inline-flex';
      document.getElementById('mainUploadZone').style.display = 'none';
    };
    reader.readAsDataURL(input.files[0]);
  }

  function removeMainImg() {
    document.getElementById('mainImgPreview').style.display = 'none';
    document.getElementById('mainImgPreview').src = '';
    document.getElementById('removeMainBtn').style.display = 'none';
    document.getElementById('mainUploadZone').style.display = 'block';
    document.getElementById('fMainImage').value = '';
  }

  // ẢNH PHỤ
  function addThumbImgs(input) {
    const files = Array.from(input.files);
    const remaining = 4 - thumbFiles.length;
    const toAdd = files.slice(0, remaining);
    toAdd.forEach(file => {
      thumbFiles.push(file);
      const reader = new FileReader();
      reader.onload = e => renderThumbGrid();
      reader.readAsDataURL(file);
    });
    if (files.length > remaining) showToast('Tối đa 4 ảnh phụ!', 'info');
    input.value = '';
  }

  function removeThumb(index) {
    thumbFiles.splice(index, 1);
    renderThumbGrid();
  }

  function renderThumbGrid() {
    const grid = document.getElementById('thumbGrid');
    grid.innerHTML = '';

    // Render các ảnh đã chọn
    thumbFiles.forEach((file, i) => {
      const url = URL.createObjectURL(file);
      grid.innerHTML += `
        <div class="thumb-preview-item">
          <img src="${url}" alt=""/>
          <button class="remove-thumb" onclick="removeThumb(${i})">✕</button>
        </div>`;
    });

    // Nút thêm (nếu chưa đủ 4)
    if (thumbFiles.length < 4) {
      grid.innerHTML += `
        <div class="thumb-add-btn">
          <input type="file" accept=".jpg,.jpeg,.png,.webp" multiple onchange="addThumbImgs(this)"/>
          <span>＋</span>
        </div>`;
    }
  }

  function openModal(p = null) {
    document.getElementById('modalTitle').textContent  = p ? 'Sửa sản phẩm' : 'Thêm sản phẩm';
    document.getElementById('editId').value            = p?.product_id || '';
    document.getElementById('fName').value             = p?.product_name || '';
    document.getElementById('fBrand').value            = p?.brand || '';
    document.getElementById('fCategory').value         = p?.category_id || '';
    document.getElementById('fPrice').value            = p?.price || '';
    document.getElementById('fDiscount').value         = p?.discount || 0;
    document.getElementById('fStock').value            = p?.stock || 0;
    document.getElementById('fDesc').value             = p?.description || '';
    document.getElementById('fActive').value           = p?.is_active ?? 1;
    document.getElementById('statusGroup').style.display = p ? 'block' : 'none';

    // Reset ảnh
    removeMainImg();
    thumbFiles = [];
    renderThumbGrid();

    // Nếu sửa và có ảnh cũ
    if (p?.image_url) {
      const preview = document.getElementById('mainImgPreview');
      preview.src = p.image_url;
      preview.style.display = 'block';
      document.getElementById('removeMainBtn').style.display = 'inline-flex';
      document.getElementById('mainUploadZone').style.display = 'none';
    }

    document.getElementById('productModal').style.display = 'flex';
  }

  function closeModal() { document.getElementById('productModal').style.display = 'none'; }

  function editProduct(id) {
    const p = allProducts.find(x => x.product_id === id);
    if (p) openModal(p);
  }

  async function saveProduct() {
    const id        = document.getElementById('editId').value;
    const mainFile  = document.getElementById('fMainImage').files[0];
    const name      = document.getElementById('fName').value.trim();
    const btn       = document.getElementById('saveBtn');

    if (!name) { showToast('Vui lòng nhập tên sản phẩm!', 'error'); return; }

    btn.disabled = true; btn.textContent = 'Đang lưu...';

    try {
      const token    = localStorage.getItem('token');
      const formData = new FormData();
      formData.append('category_id',  document.getElementById('fCategory').value);
      formData.append('product_name', name);
      formData.append('brand',        document.getElementById('fBrand').value.trim());
      formData.append('price',        document.getElementById('fPrice').value);
      formData.append('discount',     document.getElementById('fDiscount').value || 0);
      formData.append('stock',        document.getElementById('fStock').value || 0);
      formData.append('description',  document.getElementById('fDesc').value);
      formData.append('is_active',    document.getElementById('fActive').value);

      // Ảnh chính
      if (mainFile) formData.append('image', mainFile);
      else if (document.getElementById('mainImgPreview').src)
        formData.append('image_url', document.getElementById('mainImgPreview').src);

      // Ảnh phụ (tối đa 4)
      thumbFiles.forEach((file, i) => formData.append('thumb_images', file));

      const url    = id ? `http://localhost:5000/api/products/${id}` : 'http://localhost:5000/api/products';
      const method = id ? 'PUT' : 'POST';
      const res    = await fetch(url, { method, headers: { 'Authorization': 'Bearer ' + token }, body: formData });
      const data   = await res.json();
      if (!res.ok) throw new Error(data.message);

      showToast(id ? 'Cập nhật thành công!' : 'Thêm sản phẩm thành công!', 'success');
      closeModal();
      await loadProducts();
    } catch(e) { showToast(e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Lưu sản phẩm'; }
  }

  async function deleteProduct(id, name) {
    if (!confirm(`Xóa sản phẩm "${name}"?`)) return;
    try { await Products.delete(id); showToast('Đã xóa!', 'success'); await loadProducts(); }
    catch(e) { showToast(e.message, 'error'); }
  }

  loadData();
</script>
</body>
</html>
