<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tin tức — Ascent-Music</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .news-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.5rem; }
    .news-card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius-lg); overflow:hidden; transition:var(--transition);
      display:flex; flex-direction:column;
    }
    .news-card:hover { border-color:rgba(201,168,76,.4); transform:translateY(-4px); box-shadow:var(--shadow); }
    .news-img { aspect-ratio:16/9; background:var(--bg3); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:3rem; }
    .news-img img { width:100%; height:100%; object-fit:cover; transition:.3s; }
    .news-card:hover .news-img img { transform:scale(1.05); }
    .news-body { padding:1.2rem; flex:1; display:flex; flex-direction:column; }
    .news-tag {
      display:inline-block; background:rgba(201,168,76,.12); color:var(--gold);
      font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
      padding:.2rem .7rem; border-radius:999px; margin-bottom:.7rem;
    }
    .news-title {
      font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:600;
      line-height:1.4; margin-bottom:.6rem; color:var(--cream); flex:1;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .news-title a { color:inherit; text-decoration:none; }
    .news-title a:hover { color:var(--gold); }
    .news-desc {
      font-size:.85rem; color:var(--muted); line-height:1.6; margin-bottom:1rem;
      display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    }
    .news-meta { display:flex; align-items:center; justify-content:space-between; font-size:.78rem; color:var(--muted); margin-top:auto; }

    /* Bài nổi bật */
    .featured-post {
      background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-lg);
      overflow:hidden; display:grid; grid-template-columns:1fr 1fr; gap:0; margin-bottom:2.5rem;
    }
    .featured-post-img { aspect-ratio:4/3; overflow:hidden; }
    .featured-post-img img { width:100%; height:100%; object-fit:cover; transition:.4s; }
    .featured-post:hover .featured-post-img img { transform:scale(1.03); }
    .featured-post-body { padding:2rem; display:flex; flex-direction:column; justify-content:center; }
    @media(max-width:700px){
      .featured-post { grid-template-columns:1fr; }
      .featured-post-img { aspect-ratio:16/9; }
    }

    /* Filter tags */
    .tag-filter { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:2rem; }
    .tag-pill {
      padding:.35rem .9rem; border-radius:999px; font-size:.82rem; font-weight:500;
      border:1px solid var(--border); background:none; color:var(--muted);
      cursor:pointer; transition:.15s;
    }
    .tag-pill:hover { border-color:var(--gold); color:var(--gold); }
    .tag-pill.active { background:var(--gold); border-color:var(--gold); color:#000; font-weight:600; }

    /* Search */
    .news-search {
      position:relative; max-width:360px; margin-bottom:2rem;
    }
    .news-search input {
      width:100%; padding:.6rem 1rem .6rem 2.5rem;
      background:var(--bg2); border:1px solid var(--border);
      border-radius:999px; color:var(--cream); font-size:.88rem;
      transition:.2s;
    }
    .news-search input:focus { outline:none; border-color:var(--gold); }
    .news-search span { position:absolute; left:.9rem; top:50%; transform:translateY(-50%); color:var(--muted); }
  </style>
</head>
<body>
<div id="header-placeholder"></div>

<div class="section" style="padding-top:2rem">
  <div class="section-header" style="margin-bottom:2rem">
    <div>
      <h2 class="section-title">Tin tức <span>âm nhạc</span></h2>
      <p class="section-sub">Cập nhật kiến thức, xu hướng và sự kiện âm nhạc mới nhất</p>
    </div>
  </div>

  <!-- BÀI NỔI BẬT -->
  <div id="featuredWrap"></div>

  <!-- SEARCH + FILTER -->
  <div class="news-search">
    <span>🔍</span>
    <input type="text" id="searchBox" placeholder="Tìm bài viết..." oninput="debounceSearch()"/>
  </div>
  <div class="tag-filter" id="tagFilter"></div>

  <!-- DANH SÁCH -->
  <div class="news-grid" id="newsGrid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>

  <!-- PAGINATION -->
  <div id="pagination" style="display:flex;gap:.4rem;justify-content:center;margin-top:2.5rem"></div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script>
  renderHeader('news');
  renderFooter();

  let currentPage = 1, currentTag = '', searchTimer;

  const TAG_EMOJIS = { Piano:'🎹', Guitar:'🎸', Violin:'🎻', 'Thanh nhạc':'🎤', 'Kiến thức':'📚', 'Sự kiện':'🎉', 'Khuyến mãi':'🏷️' };

  // ====== INIT ======
  async function init() {
    await Promise.all([ loadTags(), loadNews(1) ]);
  }

  // ====== TAGS ======
  async function loadTags() {
    try {
      const tags = await api.get('/news/tags');
      const bar = document.getElementById('tagFilter');
      bar.innerHTML = `<button class="tag-pill active" onclick="setTag('')">Tất cả</button>` +
        tags.map(t => `<button class="tag-pill" onclick="setTag('${t.tag}')">${TAG_EMOJIS[t.tag]||''} ${t.tag} <span style="opacity:.6">(${t.count})</span></button>`).join('');
    } catch {}
  }

  function setTag(tag) {
    currentTag = tag;
    currentPage = 1;
    document.querySelectorAll('.tag-pill').forEach(el => {
      const elTag = el.textContent.trim().replace(/\s*\(\d+\)$/,'');
      el.classList.toggle('active', tag==='' ? elTag==='Tất cả' : elTag.includes(tag));
    });
    loadNews(1);
  }

  function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage=1; loadNews(1); }, 400);
  }

  // ====== LOAD NEWS ======
  async function loadNews(page=1) {
    currentPage = page;
    const search = document.getElementById('searchBox').value.trim();
    document.getElementById('newsGrid').innerHTML =
      '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div></div>';
    try {
      const params = new URLSearchParams({ page, limit:9 });
      if (currentTag) params.set('tag', currentTag);
      if (search)     params.set('search', search);
      const data = await api.get('/news?' + params);

      renderFeatured(data.posts, page);
      renderGrid(data.posts);
      renderPagination(data.total_pages, page);
    } catch(e) { showToast('Lỗi: '+e.message,'error'); console.error(e); document.getElementById('newsGrid').innerHTML='<div class=empty-state style=grid-column:1/-1><div class=icon>❌</div><p>'+e.message+'</p></div>'; }
  }

  // ====== FEATURED ======
  function renderFeatured(posts, page) {
    const wrap = document.getElementById('featuredWrap');
    if (page > 1 || currentTag || document.getElementById('searchBox').value) { wrap.innerHTML=''; return; }
    const f = posts.find(p => p.is_featured) || posts[0];
    if (!f) { wrap.innerHTML=''; return; }
    wrap.innerHTML = `
      <a href="news-detail.html?slug=${f.slug}" style="text-decoration:none">
        <div class="featured-post">
          <div class="featured-post-img">
            ${f.thumbnail
              ? `<img src="${f.thumbnail}" alt="${f.title}"/>`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;background:var(--bg3)">${TAG_EMOJIS[f.tag]||'📰'}</div>`}
          </div>
          <div class="featured-post-body">
            <span class="news-tag">⭐ Nổi bật</span>
            <h2 style="font-family:'Playfair Display',serif;font-size:1.5rem;margin-bottom:1rem;line-height:1.3;color:var(--cream)">${f.title}</h2>
            <p style="color:var(--muted);font-size:.9rem;line-height:1.7;margin-bottom:1.5rem">${f.excerpt||''}</p>
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:.8rem;color:var(--muted)">📅 ${new Date(f.published_at).toLocaleDateString('vi-VN')} &nbsp;·&nbsp; 👁 ${(f.views||0).toLocaleString()} lượt xem</span>
              <span class="btn btn-primary btn-sm">Đọc tiếp →</span>
            </div>
          </div>
        </div>
      </a>`;
  }

  // ====== GRID ======
  function renderGrid(posts) {
    const grid = document.getElementById('newsGrid');
    const items = posts.filter(p => !p.is_featured || currentTag || currentPage>1 || document.getElementById('searchBox').value);
    if (!items.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="icon">📰</div><h3>Không tìm thấy bài viết</h3>
        <p>Thử tìm với từ khóa khác nhé!</p></div>`;
      return;
    }
    grid.innerHTML = items.map(p => `
      <div class="news-card">
        <a href="news-detail.html?slug=${p.slug}" style="display:block">
          <div class="news-img">
            ${p.thumbnail
              ? `<img src="${p.thumbnail}" alt="${p.title}" loading="lazy"/>`
              : (TAG_EMOJIS[p.tag]||'📰')}
          </div>
        </a>
        <div class="news-body">
          ${p.tag ? `<span class="news-tag">${TAG_EMOJIS[p.tag]||''} ${p.tag}</span>` : ''}
          <div class="news-title">
            <a href="news-detail.html?slug=${p.slug}">${p.title}</a>
          </div>
          <p class="news-desc">${p.excerpt||''}</p>
          <div class="news-meta">
            <span>📅 ${new Date(p.published_at).toLocaleDateString('vi-VN')} &nbsp;·&nbsp; 👁 ${(p.views||0).toLocaleString()}</span>
            <a href="news-detail.html?slug=${p.slug}" style="color:var(--gold);font-size:.82rem;text-decoration:none;white-space:nowrap">Đọc tiếp →</a>
          </div>
        </div>
      </div>`).join('');
  }

  function renderPagination(totalPages, current) {
    const div = document.getElementById('pagination');
    if (totalPages<=1) { div.innerHTML=''; return; }
    div.innerHTML = Array.from({length:totalPages},(_,i)=>i+1)
      .map(i=>`<button class="page-btn ${i===current?'active':''}" onclick="loadNews(${i})">${i}</button>`)
      .join('');
  }

  init();
</script>
</body>
</html>
