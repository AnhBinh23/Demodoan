<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý Giáo viên — Admin</title>
  <link rel="stylesheet" href="admin.css"/>
  <style>
    html, body { overflow-x: hidden; }

    /* Avatar */
    .avatar-circle {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--gold-dim); display: flex;
      align-items: center; justify-content: center;
      font-weight: 700; color: var(--gold-light); font-size: 1rem; flex-shrink: 0;
    }
    .avatar-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    /* Specialty badge */
    .specialty-badge {
      padding: .2rem .6rem; border-radius: 20px; font-size: .75rem; font-weight: 600;
      background: rgba(201,168,76,.15); color: var(--gold);
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border); border-radius: var(--radius); padding: 1rem;
      text-align: center; cursor: pointer; position: relative;
      background: var(--bg3); transition: .2s;
    }
    .upload-zone:hover { border-color: var(--gold); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .avatar-preview {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      display: none; margin: 0.5rem auto 0; border: 2px solid var(--gold);
    }

    /* Profile modal */
    .profile-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      display: none; align-items: center; justify-content: center;
      z-index: 300; padding: 1rem;
    }
    .profile-modal-overlay.open { display: flex; }

    .profile-modal {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); width: 100%; max-width: 680px;
      max-height: 90vh; display: flex; flex-direction: column;
    }
    .profile-modal-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--border);
    }
    .profile-modal-head h3 { font-size: 1rem; font-weight: 700; }
    .profile-tabs {
      display: flex; border-bottom: 1px solid var(--border);
    }
    .ptab {
      flex: 1; padding: .7rem; background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer;
      font-size: .87rem; color: var(--muted); font-family: inherit;
      transition: .2s;
    }
    .ptab:hover  { color: var(--cream); }
    .ptab.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }

    .profile-body { flex: 1; overflow-y: auto; padding: 1.4rem; }

    /* Info grid */
    .info-grid {
      display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .info-avatar-box { text-align: center; flex-shrink: 0; }
    .info-avatar-box img {
      width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
      background: var(--bg3); border: 2px solid var(--border);
    }
    .info-avatar-box .name { margin-top: .5rem; font-weight: 600; }
    .info-fields {
      flex: 1; min-width: 220px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: .6rem .8rem; font-size: .87rem;
    }
    .info-row label { color: var(--muted); font-size: .78rem; }
    .info-row .val  { font-weight: 500; margin-top: .1rem; }

    /* Class item */
    .class-item {
      padding: .6rem .85rem; background: var(--bg3); border-radius: 8px;
      margin-bottom: .4rem; display: flex; justify-content: space-between;
      align-items: center; font-size: .85rem; gap: .5rem; flex-wrap: wrap;
    }

    /* Schedule item */
    .schedule-item {
      padding: .8rem 1rem; background: var(--bg3); border-radius: 10px;
      border-left: 3px solid var(--gold); margin-bottom: .6rem;
    }
    .schedule-item.ended { border-left-color: var(--border); opacity: .7; }

    /* Salary cards */
    .salary-cards {
      display: grid; grid-template-columns: repeat(4,1fr); gap: .6rem;
      margin-bottom: 1rem;
    }
    .salary-card {
      padding: .7rem; background: var(--bg3); border-radius: 8px; text-align: center;
    }
    .salary-card .sc-val   { font-size: 1.35rem; font-weight: 700; }
    .salary-card .sc-label { font-size: .73rem; color: var(--muted); margin-top: .2rem; }
    .salary-total {
      padding: 1rem; background: rgba(201,168,76,.1);
      border: 1px solid var(--gold); border-radius: 10px; margin-bottom: 1rem;
    }
    .salary-total .desc { font-size: .84rem; color: var(--muted); margin-bottom: .3rem; }
    .salary-total .amount { font-size: 1.4rem; font-weight: 700; color: var(--gold); }
    .salary-total .month  { font-size: .78rem; color: var(--muted); margin-top: .2rem; }

    /* Attendance log */
    .att-row {
      display: flex; justify-content: space-between;
      padding: .4rem .7rem; background: var(--bg3);
      border-radius: 6px; font-size: .82rem; margin-bottom: .3rem;
    }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>

<main class="admin-main">

  <!-- HEADER -->
  <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem">
    <div>
      <h1>👨‍🏫 Giáo viên</h1>
      <p>Quản lý đội ngũ giáo viên trung tâm</p>
    </div>
    <button class="btn btn-primary" onclick="openModal()">+ Thêm giáo viên</button>
  </div>

  <!-- STATS -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem">
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(201,168,76,.1)">👨‍🏫</div>
      <div class="stat-info"><div class="value" id="stTotal">—</div><div class="label">Tổng giáo viên</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(76,175,128,.1)">✅</div>
      <div class="stat-info"><div class="value" id="stActive">—</div><div class="label">Đang làm</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(100,149,237,.1)">🎓</div>
      <div class="stat-info"><div class="value" id="stClasses">—</div><div class="label">Lớp đang dạy</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(186,85,211,.1)">🎵</div>
      <div class="stat-info"><div class="value" id="stSpec">—</div><div class="label">Chuyên môn</div></div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="admin-table-wrap">
    <div class="table-toolbar">
      <div class="search-input">
        <span>🔍</span>
        <input type="text" placeholder="Tìm giáo viên..." id="searchInput" oninput="filterTeachers()"/>
      </div>
      <select class="form-select" style="width:auto" id="specFilter" onchange="filterTeachers()">
        <option value="">Tất cả chuyên môn</option>
        <option>Piano</option><option>Guitar</option><option>Violin</option>
        <option>Organ</option><option>Thanh nhạc</option><option>Trống</option>
      </select>
      <select class="form-select" style="width:auto" id="statusFilter" onchange="filterTeachers()">
        <option value="">Tất cả trạng thái</option>
        <option value="1">Đang làm</option>
        <option value="0">Đã nghỉ</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Giáo viên</th>
          <th>Chuyên môn</th>
          <th>Kinh nghiệm</th>
          <th>Lớp đang dạy</th>
          <th>Lương / buổi</th>
          <th>Ngày vào</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="teachersBody">
        <tr><td colspan="8"><div class="loading"><div class="spinner"></div></div></td></tr>
      </tbody>
    </table>
  </div>

</main>

<!-- ══════════════════════════════════════════════
     MODAL THÊM / SỬA GIÁO VIÊN
══════════════════════════════════════════════ -->
<div class="modal-overlay" id="teacherModal" style="display:none">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h3 id="modalTitle">Thêm giáo viên</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="editId"/>

    <!-- Avatar upload -->
    <div class="form-group" style="text-align:center">
      <div class="upload-zone" id="avatarZone"
           style="display:inline-block;width:110px;height:110px;border-radius:50%;padding:.5rem">
        <input type="file" id="fAvatar" accept="image/*" onchange="previewAvatar(this)"/>
        <div style="font-size:2rem">📷</div>
        <p style="font-size:.7rem;color:var(--muted);margin:0">Chọn ảnh</p>
      </div>
      <img id="avatarPreview" class="avatar-preview" alt=""/>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Họ và tên *</label>
        <input type="text" class="form-input" id="fName" placeholder="Nguyễn Thị Lan"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email *</label>
        <input type="email" class="form-input" id="fEmail" placeholder="giaovien@email.com"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Số điện thoại</label>
        <input type="text" class="form-input" id="fPhone" placeholder="090xxxxxxx"/>
      </div>
      <div class="form-group">
        <label class="form-label">Chuyên môn *</label>
        <select class="form-select" id="fSpecialty">
          <option value="">-- Chọn --</option>
          <option>Piano</option><option>Guitar</option><option>Violin</option>
          <option>Organ</option><option>Thanh nhạc</option><option>Trống</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Bằng cấp / Chứng chỉ</label>
        <input type="text" class="form-input" id="fDegree" placeholder="Cử nhân Âm nhạc"/>
      </div>
      <div class="form-group">
        <label class="form-label">Số năm kinh nghiệm</label>
        <input type="number" class="form-input" id="fExp" placeholder="5" min="0"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Lương</label>
        <input type="number" class="form-input" id="fSalary" placeholder="200000"/>
      </div>
      <div class="form-group">
        <label class="form-label">Loại lương</label>
        <select class="form-select" id="fSalaryType">
          <option value="per_session">Theo buổi</option>
          <option value="monthly">Theo tháng</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Ngày vào làm</label>
        <input type="date" class="form-input" id="fJoinDate"/>
      </div>
      <div class="form-group" id="statusGroup" style="display:none">
        <label class="form-label">Trạng thái</label>
        <select class="form-select" id="fActive">
          <option value="1">Đang làm</option>
          <option value="0">Đã nghỉ</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Giới thiệu bản thân</label>
      <textarea class="form-textarea" id="fBio"
                placeholder="Kinh nghiệm, thành tích..." style="min-height:80px"></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveTeacher()">Lưu</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     MODAL HỒ SƠ GIÁO VIÊN (3 TAB)
══════════════════════════════════════════════ -->
<div class="profile-modal-overlay" id="profileModal">
  <div class="profile-modal">

    <div class="profile-modal-head">
      <h3>👤 Hồ sơ giáo viên</h3>
      <button class="modal-close" onclick="closeProfileModal()">✕</button>
    </div>

    <div class="profile-tabs">
      <button class="ptab active" id="tab-info"     onclick="switchTab('info')"    >👁️ Thông tin</button>
      <button class="ptab"        id="tab-schedule" onclick="switchTab('schedule')">📅 Lịch dạy</button>
      <button class="ptab"        id="tab-salary"   onclick="switchTab('salary')"  >💰 Tính lương</button>
    </div>

    <div class="profile-body">
      <div id="panel-info"></div>
      <div id="panel-schedule" style="display:none"></div>
      <div id="panel-salary"   style="display:none"></div>
    </div>

  </div>
</div>

<div id="toast-container"></div>
<script src="../../js/api.js"></script>
<script src="sidebar.js"></script>
<script>
renderSidebar('teachers');
let allTeachers = [];

/* ══════════════════════
   LOAD & RENDER TABLE
══════════════════════ */
async function loadTeachers() {
  try {
    allTeachers = await api.get('/center/teachers');
    renderStats(allTeachers);
    renderTable(allTeachers);
  } catch(e) { showToast(e.message, 'error'); }
}

function renderStats(data) {
  document.getElementById('stTotal').textContent   = data.length;
  document.getElementById('stActive').textContent  = data.filter(t => t.is_active).length;
  document.getElementById('stClasses').textContent = data.reduce((s,t) => s + (t.active_classes||0), 0);
  document.getElementById('stSpec').textContent    = [...new Set(data.map(t => t.specialty))].length;
}

function renderTable(data) {
  const tbody = document.getElementById('teachersBody');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="8">
      <div class="empty-state"><div class="icon">👨‍🏫</div><p>Chưa có giáo viên nào</p></div>
    </td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(t => `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:.75rem">
          <div class="avatar-circle">
            ${t.avatar
              ? `<img src="${t.avatar}" alt=""/>`
              : (t.full_name?.[0]||'?').toUpperCase()}
          </div>
          <div>
            <div style="font-weight:600;line-height:1.2">${t.full_name}</div>
            <div style="font-size:.76rem;color:var(--muted)">${t.email||'—'}</div>
          </div>
        </div>
      </td>
      <td><span class="specialty-badge">${t.specialty}</span></td>
      <td style="color:var(--muted)">${t.experience_years||0} năm</td>
      <td>
        <span style="color:var(--gold);font-weight:600">${t.active_classes||0}</span>
        <span style="color:var(--muted);font-size:.78rem"> / ${t.total_classes||0} lớp</span>
      </td>
      <td style="color:var(--gold)">
        ${formatPrice(t.salary)}
        <span style="color:var(--muted);font-size:.74rem">${t.salary_type==='monthly'?'/tháng':'/buổi'}</span>
      </td>
      <td style="color:var(--muted);font-size:.84rem">
        ${t.join_date ? new Date(t.join_date).toLocaleDateString('vi-VN') : '—'}
      </td>
      <td>
        <span class="badge ${t.is_active?'badge-active':'badge-inactive'}">
          ${t.is_active?'Đang làm':'Đã nghỉ'}
        </span>
      </td>
      <td>
        <div style="display:flex;gap:.4rem;flex-wrap:nowrap">
          <button class="btn btn-sm" title="Xem hồ sơ"
            style="background:rgba(100,149,237,.15);border:1px solid #6495ed;color:#6495ed"
            onclick="viewTeacher(${t.teacher_id})">👁️</button>
          <button class="btn btn-outline btn-sm" title="Sửa"
            onclick="editTeacher(${t.teacher_id})">✏️</button>
          <button class="btn btn-danger btn-sm" title="Xóa"
            onclick="deleteTeacher(${t.teacher_id},'${(t.full_name||'').replace(/'/g,"\\'")}')">🗑</button>
        </div>
      </td>
    </tr>`).join('');
}

function filterTeachers() {
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const sp  = document.getElementById('specFilter').value;
  const sta = document.getElementById('statusFilter').value;
  renderTable(allTeachers.filter(t =>
    (!q   || (t.full_name||'').toLowerCase().includes(q) || (t.email||'').toLowerCase().includes(q)) &&
    (!sp  || t.specialty === sp) &&
    (sta === '' || String(Number(t.is_active)) === sta)
  ));
}

/* ══════════════════════
   MODAL THÊM / SỬA
══════════════════════ */
function previewAvatar(input) {
  if (!input.files?.[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById('avatarPreview');
    prev.src = e.target.result; prev.style.display = 'block';
    document.getElementById('avatarZone').style.display = 'none';
  };
  reader.readAsDataURL(input.files[0]);
}

function resetAvatarZone() {
  document.getElementById('avatarPreview').style.display = 'none';
  document.getElementById('avatarPreview').src = '';
  document.getElementById('avatarZone').style.display = 'inline-block';
  document.getElementById('fAvatar').value = '';
}

function openModal(t = null) {
  document.getElementById('modalTitle').textContent  = t ? 'Sửa giáo viên' : 'Thêm giáo viên';
  document.getElementById('editId').value            = t?.teacher_id || '';
  document.getElementById('fName').value             = t?.full_name || '';
  document.getElementById('fEmail').value            = t?.email || '';
  document.getElementById('fPhone').value            = t?.phone || '';
  document.getElementById('fSpecialty').value        = t?.specialty || '';
  document.getElementById('fDegree').value           = t?.degree || '';
  document.getElementById('fExp').value              = t?.experience_years || 0;
  document.getElementById('fSalary').value           = t?.salary || '';
  document.getElementById('fSalaryType').value       = t?.salary_type || 'per_session';
  document.getElementById('fJoinDate').value         = t?.join_date?.split('T')[0] || '';
  document.getElementById('fBio').value              = t?.bio || '';
  document.getElementById('fActive').value           = t != null ? (t.is_active ?? 1) : 1;
  document.getElementById('statusGroup').style.display = t ? 'block' : 'none';
  resetAvatarZone();
  if (t?.avatar) {
    document.getElementById('avatarPreview').src = t.avatar;
    document.getElementById('avatarPreview').style.display = 'block';
    document.getElementById('avatarZone').style.display = 'none';
  }
  document.getElementById('teacherModal').style.display = 'flex';
}

function closeModal() { document.getElementById('teacherModal').style.display = 'none'; }

function editTeacher(id) {
  const t = allTeachers.find(x => x.teacher_id === id);
  if (t) openModal(t);
}

async function saveTeacher() {
  const id   = document.getElementById('editId').value;
  const name = document.getElementById('fName').value.trim();
  const spec = document.getElementById('fSpecialty').value;
  if (!name || !spec) { showToast('Vui lòng điền Họ tên và Chuyên môn!', 'error'); return; }

  const fd = new FormData();
  fd.append('full_name',        name);
  fd.append('email',            document.getElementById('fEmail').value.trim());
  fd.append('phone',            document.getElementById('fPhone').value.trim());
  fd.append('specialty',        spec);
  fd.append('degree',           document.getElementById('fDegree').value.trim());
  fd.append('experience_years', document.getElementById('fExp').value || 0);
  fd.append('salary',           document.getElementById('fSalary').value || 0);
  fd.append('salary_type',      document.getElementById('fSalaryType').value);
  fd.append('join_date',        document.getElementById('fJoinDate').value);
  fd.append('bio',              document.getElementById('fBio').value.trim());
  if (id) fd.append('is_active', document.getElementById('fActive').value);
  const avatarFile = document.getElementById('fAvatar').files[0];
  if (avatarFile) fd.append('avatar', avatarFile);

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Đang lưu...';
  try {
    const token = localStorage.getItem('token');
    const url    = `http://localhost:5000/api/center/teachers${id ? '/' + id : ''}`;
    const method = id ? 'PUT' : 'POST';
    const res    = await fetch(url, { method, headers: { Authorization: 'Bearer ' + token }, body: fd });
    const data   = await res.json();
    if (!res.ok) throw new Error(data.message);
    showToast(id ? 'Cập nhật thành công!' : 'Thêm giáo viên thành công!', 'success');
    closeModal();
    await loadTeachers();
  } catch(e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Lưu'; }
}

async function deleteTeacher(id, name) {
  if (!confirm(`Xóa giáo viên "${name}"?\nLưu ý: không thể xóa nếu đang phụ trách lớp.`)) return;
  try {
    await api.delete('/center/teachers/' + id);
    showToast('Đã xóa giáo viên!', 'success');
    await loadTeachers();
  } catch(e) { showToast(e.message, 'error'); }
}

/* ══════════════════════
   MODAL HỒ SƠ – 3 TAB
══════════════════════ */
let currentViewId = null;

function viewTeacher(id) {
  currentViewId = id;
  document.getElementById('profileModal').classList.add('open');
  switchTab('info');
}

function closeProfileModal() {
  document.getElementById('profileModal').classList.remove('open');
  currentViewId = null;
}

function switchTab(tab) {
  ['info','schedule','salary'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('panel-' + t).style.display = t === tab ? 'block' : 'none';
  });
  if (tab === 'info')     loadProfileInfo(currentViewId);
  if (tab === 'schedule') loadSchedule(currentViewId);
  if (tab === 'salary')   loadSalary(currentViewId);
}

/* — Tab 1: Thông tin — */
async function loadProfileInfo(id) {
  const panel = document.getElementById('panel-info');
  panel.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const t = await api.get('/center/teachers/' + id);
    panel.innerHTML = `
      <div class="info-grid">
        <div class="info-avatar-box">
          <img src="${t.avatar||''}" onerror="this.style.background='var(--bg3)';this.src=''" alt=""/>
          <div class="name">${t.full_name}</div>
          <span class="badge ${t.is_active?'badge-active':'badge-inactive'}" style="margin-top:.3rem">
            ${t.is_active?'Đang làm':'Đã nghỉ'}
          </span>
        </div>
        <div class="info-fields">
          ${infoRow('📧 Email',      t.email||'—')}
          ${infoRow('📞 Điện thoại', t.phone||'—')}
          ${infoRow('🎵 Chuyên môn', t.specialty)}
          ${infoRow('🎓 Bằng cấp',   t.degree||'—')}
          ${infoRow('📅 Kinh nghiệm',(t.experience_years||0)+' năm')}
          ${infoRow('🗓️ Ngày vào làm', t.join_date ? new Date(t.join_date).toLocaleDateString('vi-VN') : '—')}
          ${infoRow('💰 Lương', formatPrice(t.salary) + (t.salary_type==='monthly'?' /tháng':' /buổi'))}
        </div>
      </div>
      ${t.bio ? `
        <div style="padding:.8rem;background:var(--bg3);border-radius:8px;font-size:.86rem;color:var(--muted);margin-bottom:1rem">
          ${t.bio}
        </div>` : ''}
      <div>
        <div style="font-weight:600;margin-bottom:.6rem;font-size:.9rem">
          📚 Lớp đang phụ trách
          <span style="color:var(--muted);font-weight:400">(${t.classes?.length||0} lớp)</span>
        </div>
        ${!t.classes?.length
          ? '<p style="color:var(--muted);font-size:.85rem">Chưa có lớp nào</p>'
          : t.classes.map(c => `
              <div class="class-item">
                <div>
                  <span style="font-weight:600">${c.class_name}</span>
                  <span style="color:var(--muted);margin-left:.5rem;font-size:.82rem">${c.course_name}</span>
                </div>
                <div style="display:flex;gap:.7rem;align-items:center">
                  <span style="color:var(--muted);font-size:.82rem">👥 ${c.student_count||0} HV</span>
                  <span class="badge ${c.status==='ongoing'?'badge-active':'badge-inactive'}" style="font-size:.72rem">
                    ${c.status==='ongoing'?'Đang dạy':'Kết thúc'}
                  </span>
                </div>
              </div>`).join('')}
      </div>`;
  } catch(e) {
    panel.innerHTML = `<p style="color:var(--red);text-align:center;padding:2rem">${e.message}</p>`;
  }
}

function infoRow(label, value) {
  return `<div class="info-row">
    <label>${label}</label>
    <div class="val">${value}</div>
  </div>`;
}

/* — Tab 2: Lịch dạy — */
async function loadSchedule(id) {
  const panel = document.getElementById('panel-schedule');
  panel.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const classes = await api.get('/center/classes?teacher_id=' + id);
    if (!classes.length) {
      panel.innerHTML = '<div class="empty-state"><div class="icon">📅</div><p>Giáo viên chưa có lớp nào</p></div>';
      return;
    }
    const dayMap = { Mon:'Thứ 2',Tue:'Thứ 3',Wed:'Thứ 4',Thu:'Thứ 5',Fri:'Thứ 6',Sat:'Thứ 7',Sun:'CN' };
    panel.innerHTML = classes.map(c => {
      const days = (c.schedule_days||'').split(',').map(d => dayMap[d.trim()]||d).filter(Boolean).join(', ');
      return `
        <div class="schedule-item ${c.status!=='ongoing'?'ended':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.3rem">
            <div>
              <span style="font-weight:600">${c.class_name}</span>
              <span style="color:var(--muted);font-size:.82rem;margin-left:.5rem">${c.course_name}</span>
            </div>
            <span class="badge ${c.status==='ongoing'?'badge-active':'badge-inactive'}" style="font-size:.74rem">
              ${c.status==='ongoing'?'Đang dạy':'Kết thúc'}
            </span>
          </div>
          <div style="margin-top:.4rem;display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted)">
            ${days             ? `<span>📅 ${days}</span>`              : ''}
            ${c.schedule_time  ? `<span>🕐 ${c.schedule_time}</span>`   : ''}
            ${c.room           ? `<span>🏫 Phòng ${c.room}</span>`      : ''}
            <span>👥 ${c.student_count||0}/${c.max_students||'?'} HV</span>
          </div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:.25rem">
            ${c.start_date ? '🗓️ ' + new Date(c.start_date).toLocaleDateString('vi-VN') : ''}
            ${c.end_date   ? ' → ' + new Date(c.end_date).toLocaleDateString('vi-VN')   : ''}
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    panel.innerHTML = `<p style="color:var(--red);text-align:center;padding:2rem">${e.message}</p>`;
  }
}

/* — Tab 3: Tính lương — */
let _salaryTeacher = null;

async function loadSalary(id) {
  const panel   = document.getElementById('panel-salary');
  const curMonth = new Date().toISOString().slice(0,7);

  panel.innerHTML = `
    <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
      <label style="font-size:.87rem;color:var(--muted)">📅 Chọn tháng:</label>
      <input type="month" id="salaryMonth" value="${curMonth}"
        class="form-input" style="width:auto"
        onchange="loadSalaryMonth(${id})"/>
    </div>
    <div class="loading"><div class="spinner"></div></div>`;

  await loadSalaryMonth(id);
}

async function loadSalaryMonth(id) {
  const panel = document.getElementById('panel-salary');
  const monthEl = document.getElementById('salaryMonth');
  const month = monthEl ? monthEl.value : new Date().toISOString().slice(0,7);

  // preserve month picker
  const pickerHTML = panel.querySelector('[id="salaryMonth"]')?.outerHTML || '';

  try {
    const [teacher, tk] = await Promise.all([
      api.get('/center/teachers/' + id),
      api.get('/timekeeping/teacher/' + id + '/' + month)
    ]);
    _salaryTeacher = teacher;
    const s = tk.summary;
    const perSession = teacher.salary_type === 'per_session';
    const earned = perSession ? (s.present + s.late) * teacher.salary : teacher.salary;

    panel.innerHTML = `
      <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
        <label style="font-size:.87rem;color:var(--muted)">📅 Chọn tháng:</label>
        <input type="month" id="salaryMonth" value="${month}"
          class="form-input" style="width:auto"
          onchange="loadSalaryMonth(${id})"/>
      </div>
      <div class="salary-cards">
        ${sCard('✅ Có mặt',  s.present, '#4caf80')}
        ${sCard('⏰ Đi trễ',  s.late,    '#f59e0b')}
        ${sCard('❌ Vắng',    s.absent,  '#ef4444')}
        ${sCard('🏖️ Nghỉ phép',s.leave, '#6495ed')}
      </div>
      <div class="salary-total">
        <div class="desc">
          ${perSession
            ? `Lương theo buổi: ${formatPrice(teacher.salary)}/buổi × ${s.present+s.late} buổi`
            : `Lương tháng cố định`}
        </div>
        <div class="amount">💰 ${formatPrice(earned)}</div>
        <div class="month">Tháng ${month}</div>
      </div>
      <div style="font-weight:600;margin-bottom:.5rem;font-size:.88rem">Chi tiết chấm công</div>
      <div style="max-height:200px;overflow-y:auto">
        ${!tk.records.length
          ? '<p style="color:var(--muted);font-size:.85rem;text-align:center;padding:1rem">Chưa có dữ liệu chấm công tháng này</p>'
          : tk.records.map(r => {
              const colors = {present:'#4caf80',late:'#f59e0b',absent:'#ef4444',leave:'#6495ed'};
              const labels = {present:'Có mặt',late:'Đi trễ',absent:'Vắng',leave:'Nghỉ phép'};
              return `<div class="att-row">
                <span>${new Date(r.work_date).toLocaleDateString('vi-VN')} — ${r.slot_label}</span>
                <span style="color:${colors[r.status]||'var(--muted)'};font-weight:600">
                  ${labels[r.status]||r.status}
                </span>
              </div>`;
            }).join('')}
      </div>`;
  } catch(e) {
    panel.innerHTML = `
      <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem">
        <label style="font-size:.87rem;color:var(--muted)">📅 Chọn tháng:</label>
        <input type="month" id="salaryMonth" value="${month}"
          class="form-input" style="width:auto"
          onchange="loadSalaryMonth(${id})"/>
      </div>
      <p style="color:var(--red);text-align:center;padding:2rem">${e.message}</p>`;
  }
}

function sCard(label, val, color) {
  return `<div class="salary-card">
    <div class="sc-val" style="color:${color}">${val}</div>
    <div class="sc-label">${label}</div>
  </div>`;
}
