<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Admin MusicStore</title>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>

<div id="sidebar-placeholder"></div>

<main class="admin-main">
  <div class="page-header">
    <h1>Dashboard</h1>
    <p>Tổng quan cửa hàng hôm nay</p>
  </div>

  <!-- STATS -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card" id="cardProducts"><div class="stat-icon" style="background:rgba(201,168,76,0.1)">📦</div><div class="stat-info"><div class="value" id="statProducts">...</div><div class="label">Sản phẩm</div></div></div>
    <div class="stat-card" id="cardOrders"><div class="stat-icon" style="background:rgba(76,175,128,0.1)">🛍️</div><div class="stat-info"><div class="value" id="statOrders">...</div><div class="label">Đơn hàng</div></div></div>
    <div class="stat-card" id="cardUsers"><div class="stat-icon" style="background:rgba(100,149,237,0.1)">👥</div><div class="stat-info"><div class="value" id="statUsers">...</div><div class="label">Khách hàng</div></div></div>
    <div class="stat-card" id="cardRevenue"><div class="stat-icon" style="background:rgba(186,85,211,0.1)">💰</div><div class="stat-info"><div class="value" id="statRevenue">...</div><div class="label">Doanh thu</div></div></div>
  </div>

  <!-- RECENT ORDERS -->
  <div class="admin-table-wrap">
    <div class="table-toolbar">
      <h3>Đơn hàng gần đây</h3>
      <a href="orders.html" class="btn btn-outline btn-sm" style="margin-left:auto">Xem tất cả →</a>
    </div>
    <table>
      <thead>
        <tr>
          <th>#ID</th><th>Khách hàng</th><th>Số tiền</th><th>Trạng thái</th><th>Ngày đặt</th>
        </tr>
      </thead>
      <tbody id="recentOrdersBody">
        <tr><td colspan="5"><div class="loading"><div class="spinner"></div></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<div id="toast-container"></div>
<script src="../../js/api.js"></script>
<script src="sidebar.js"></script>
<script>
  renderSidebar('dashboard');

  const statusLabels = {
    pending:'Chờ xác nhận', confirmed:'Đã xác nhận',
    shipping:'Đang giao', delivered:'Đã giao', cancelled:'Đã hủy'
  };
  const statusClass = {
    pending:'badge-pending', confirmed:'badge-confirmed',
    shipping:'badge-shipping', delivered:'badge-delivered', cancelled:'badge-cancelled'
  };

  async function loadDashboard() {
    try {
      const [products, orders] = await Promise.all([
        Products.getAll({ limit: 1 }),
        Orders.getAllOrders ? Orders.getAllOrders() : api.get('/orders/admin/all')
      ]);

      document.getElementById('statProducts').textContent = products.total || 0;
      document.getElementById('statOrders').textContent = Array.isArray(orders) ? orders.length : 0;

      const delivered = Array.isArray(orders) ? orders.filter(o => o.status === 'delivered') : [];
      const revenue = delivered.reduce((s, o) => s + Number(o.total_amount), 0);
      document.getElementById('statRevenue').textContent = formatPrice(revenue);

      // Recent orders
      const recent = Array.isArray(orders) ? orders.slice(0, 8) : [];
      document.getElementById('recentOrdersBody').innerHTML = recent.length ? recent.map(o => `
        <tr>
          <td style="color:var(--gold);font-weight:600">#${o.order_id}</td>
          <td>${o.full_name || o.receiver_name}</td>
          <td style="color:var(--gold)">${formatPrice(o.total_amount)}</td>
          <td><span class="badge ${statusClass[o.status]||''}">${statusLabels[o.status]||o.status}</span></td>
          <td style="color:var(--muted)">${new Date(o.created_at).toLocaleDateString('vi-VN')}</td>
        </tr>`).join('') : `<tr><td colspan="5"><div class="empty-state"><div class="icon">📦</div><p>Chưa có đơn hàng nào</p></div></td></tr>`;

    } catch(e) {
      showToast('Không thể tải dữ liệu: ' + e.message, 'error');
    }
  }

  // Lấy số khách hàng
  async function loadUserCount() {
    try {
      const users = await api.get('/users/admin/all').catch(() => null);
      if (users) document.getElementById('statUsers').textContent = users.length || 0;
    } catch {}
  }

  loadDashboard();

  // Điều hướng khi bấm vào stat card
  const cardLinks = {
    cardProducts: 'products.html',
    cardOrders:   'orders.html',
    cardUsers:    'users.html',
    cardRevenue:  'orders.html',
  };
  Object.entries(cardLinks).forEach(([id, url]) => {
    const el = document.getElementById(id);
    if (el) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => location.href = url);
    }
  });
</script>
</body>
</html>
