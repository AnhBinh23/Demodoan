<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Admin MusicStore</title>

  <link rel="stylesheet" href="admin.css"/>

  <style>
    .dashboard-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1.5rem;
    }

    @media (max-width: 900px){
      .dashboard-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div id="sidebar-placeholder"></div>

<main class="admin-main">

  <div class="page-header">
    <h1>Dashboard</h1>
    <p>Tổng quan cửa hàng hôm nay</p>
  </div>

  <!-- STATS -->
  <div class="stats-grid" id="statsGrid">

    <div class="stat-card" id="cardProducts">
      <div class="stat-icon" style="background:rgba(201,168,76,0.1)">📦</div>
      <div class="stat-info">
        <div class="value" id="statProducts">...</div>
        <div class="label">Sản phẩm</div>
      </div>
    </div>

    <div class="stat-card" id="cardOrders">
      <div class="stat-icon" style="background:rgba(76,175,128,0.1)">🛍️</div>
      <div class="stat-info">
        <div class="value" id="statOrders">...</div>
        <div class="label">Đơn hàng</div>
      </div>
    </div>

    <div class="stat-card" id="cardUsers">
      <div class="stat-icon" style="background:rgba(100,149,237,0.1)">👥</div>
      <div class="stat-info">
        <div class="value" id="statUsers">...</div>
        <div class="label">Khách hàng</div>
      </div>
    </div>

    <div class="stat-card" id="cardRevenue">
      <div class="stat-icon" style="background:rgba(186,85,211,0.1)">💰</div>
      <div class="stat-info">
        <div class="value" id="statRevenue">...</div>
        <div class="label">Doanh thu</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(255,165,0,0.1)">⏳</div>
      <div class="stat-info">
        <div class="value" id="statPending">...</div>
        <div class="label">Chờ xác nhận</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(224,85,85,0.1)">⚠️</div>
      <div class="stat-info">
        <div class="value" id="statLowStock">...</div>
        <div class="label">Sắp hết hàng (≤5)</div>
      </div>
    </div>

  </div>

  <!-- GRID 2 CỘT -->
  <div class="dashboard-grid">

    <!-- TOP PRODUCTS -->
    <div class="admin-table-wrap">

      <div class="table-toolbar">
        <h3>🏆 Top sản phẩm bán chạy</h3>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Sản phẩm</th>
            <th>Đã bán</th>
            <th>Doanh thu</th>
          </tr>
        </thead>

        <tbody id="topProductsBody">
          <tr>
            <td colspan="4">
              <div class="loading">
                <div class="spinner"></div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

    </div>

    <!-- RECENT ORDERS -->
    <div class="admin-table-wrap">

      <div class="table-toolbar">
        <h3>Đơn hàng gần đây</h3>

        <a href="orders.html"
           class="btn btn-outline btn-sm"
           style="margin-left:auto">
          Xem tất cả →
        </a>
      </div>

      <table>

        <thead>
          <tr>
            <th>#ID</th>
            <th>Khách hàng</th>
            <th>Số tiền</th>
            <th>Trạng thái</th>
          </tr>
        </thead>

        <tbody id="recentOrdersBody">
          <tr>
            <td colspan="4">
              <div class="loading">
                <div class="spinner"></div>
              </div>
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

</main>

<div id="toast-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="../../js/api.js"></script>
<script src="sidebar.js"></script>

<script>

renderSidebar('dashboard');

async function loadDashboard() {

    try {

        const [stats, revenueData, topProducts, orders] = await Promise.all([
            Stats.overview(),
            Stats.revenueMonth(),
            Stats.topProducts(),
            api.get('/orders/admin/all'),
        ]);

        // STATS
        document.getElementById('statProducts').textContent = stats.total_products;
        document.getElementById('statOrders').textContent   = stats.total_orders;
        document.getElementById('statUsers').textContent    = stats.total_users;
        document.getElementById('statRevenue').textContent  = formatPrice(stats.total_revenue);
        document.getElementById('statPending').textContent  = stats.pending_orders;
        document.getElementById('statLowStock').textContent = stats.low_stock;

        // BIỂU ĐỒ DOANH THU
        new Chart(document.getElementById('revenueChart'), {

            type: 'bar',

            data: {
                labels: revenueData.map(r => r.month),

                datasets: [{
                    label: 'Doanh thu (VNĐ)',
                    data: revenueData.map(r => Number(r.revenue)),
                    backgroundColor: 'rgba(201,168,76,0.5)',
                    borderColor: 'rgba(201,168,76,1)',
                    borderWidth: 1,
                    borderRadius: 4,
                }]
            },

            options: {
                responsive: true,

                plugins: {
                    legend: { display: false }
                },

                scales: {
                    y: {
                        ticks: {
                            callback: v => (v/1e6).toFixed(0) + 'tr',
                            color:'#999'
                        },
                        grid: {
                            color:'rgba(255,255,255,0.05)'
                        }
                    },

                    x: {
                        ticks: { color:'#999' },
                        grid: { display:false }
                    }
                }
            }
        });

        // TOP PRODUCTS
        document.getElementById('topProductsBody').innerHTML =
            topProducts.length

            ? topProducts.map((p, i) => `
                <tr>
                    <td style="color:var(--gold);font-weight:700">
                      ${i + 1}
                    </td>

                    <td style="font-size:0.85rem">
                      ${p.product_name}
                    </td>

                    <td style="color:var(--green);font-weight:600">
                      ${p.total_sold}
                    </td>

                    <td style="color:var(--gold)">
                      ${formatPrice(p.revenue)}
                    </td>
                </tr>
              `).join('')

            : `
                <tr>
                  <td colspan="4"
                      style="text-align:center;color:var(--muted)">
                      Chưa có dữ liệu
                  </td>
                </tr>
              `;

        // RECENT ORDERS
        const statusLabels = {
            pending   : 'Chờ xác nhận',
            confirmed : 'Đã xác nhận',
            shipping  : 'Đang giao',
            delivered : 'Đã giao',
            cancelled : 'Đã hủy'
        };

        const statusClass = {
            pending   : 'badge-pending',
            confirmed : 'badge-confirmed',
            shipping  : 'badge-shipping',
            delivered : 'badge-delivered',
            cancelled : 'badge-cancelled'
        };

        const recent = Array.isArray(orders)
            ? orders.slice(0, 6)
            : [];

        document.getElementById('recentOrdersBody').innerHTML =
            recent.length

            ? recent.map(o => `
                <tr>

                    <td style="color:var(--gold);font-weight:600">
                      #${o.order_id}
                    </td>

                    <td style="font-size:0.85rem">
                      ${o.full_name || o.receiver_name}
                    </td>

                    <td style="color:var(--gold)">
                      ${formatPrice(o.total_amount)}
                    </td>

                    <td>
                      <span class="badge ${statusClass[o.status] || ''}">
                        ${statusLabels[o.status] || o.status}
                      </span>
                    </td>

                </tr>
              `).join('')

            : `
                <tr>
                  <td colspan="4"
                      style="text-align:center;color:var(--muted)">
                      Chưa có đơn hàng
                  </td>
                </tr>
              `;

    }

    catch(e) {
        showToast('Không thể tải dữ liệu: ' + e.message, 'error');
    }
}

loadDashboard();

</script>

</body>
</html>
