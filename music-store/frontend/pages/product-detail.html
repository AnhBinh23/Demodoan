<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chi tiết sản phẩm — Ascent-Music</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    /* ===== GALLERY ===== */
    .gallery-wrap { display:flex; flex-direction:column; gap:.8rem; }

    .main-img-wrap {
      aspect-ratio:1; background:var(--bg2);
      border:1px solid var(--border); border-radius:var(--radius-lg);
      overflow:hidden; cursor:zoom-in;
    }
    .main-img-wrap img { width:100%; height:100%; object-fit:cover; transition:.3s; }
    .main-img-wrap:hover img { transform:scale(1.04); }
    .main-img-placeholder {
      width:100%; height:100%; display:flex; align-items:center;
      justify-content:center; font-size:5rem; opacity:.2;
    }

    /* ===== THUMBNAILS ===== */
    .thumb-list { display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem; }
    .thumb-item {
      aspect-ratio:1; border-radius:var(--radius); overflow:hidden;
      border:2px solid transparent; cursor:pointer;
      background:var(--bg3); transition:.2s;
    }
    .thumb-item img { width:100%; height:100%; object-fit:cover; }
    .thumb-item.active { border-color:var(--gold); }
    .thumb-item:hover { border-color:rgba(201,168,76,.5); }

    /* ===== LIGHTBOX ===== */
    .lightbox {
      position:fixed; inset:0; background:rgba(0,0,0,.92);
      display:none; align-items:center; justify-content:center; z-index:500;
    }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:90vw; max-height:90vh; border-radius:var(--radius-lg); }
    .lightbox button {
      position:fixed; width:46px; height:46px; border:none; border-radius:50%;
      background:rgba(255,255,255,.12); color:#fff; cursor:pointer; font-size:1.4rem;
    }
    .lightbox-close { top:1rem; right:1rem; }
    .lightbox-prev  { left:1rem;  top:50%; transform:translateY(-50%); }
    .lightbox-next  { right:1rem; top:50%; transform:translateY(-50%); }

    /* ===== REVIEWS ===== */
    .review-card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:1.2rem; margin-bottom:.8rem;
    }
    .review-author {
      display:flex; align-items:center; gap:.8rem; margin-bottom:.6rem;
    }
    .review-avatar {
      width:36px; height:36px; border-radius:50%; background:var(--gold-dim);
      display:flex; align-items:center; justify-content:center;
      font-weight:700; color:var(--gold-light); font-size:.9rem; flex-shrink:0;
    }
    .review-stars { color:var(--gold); font-size:.9rem; }
    .review-date  { font-size:.75rem; color:var(--muted); }
    .review-text  { font-size:.88rem; color:var(--muted); line-height:1.6; }
    .review-delete-btn {
      margin-left:auto; background:none; border:none;
      color:var(--muted); cursor:pointer; font-size:.85rem; padding:.2rem;
      border-radius:var(--radius); transition:.2s;
    }
    .review-delete-btn:hover { color:var(--red); background:rgba(224,85,85,.1); }

    /* Form đánh giá */
    .review-form-wrap {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:1.5rem; margin-bottom:1.5rem;
    }
    .star-selector { display:flex; gap:.4rem; font-size:2rem; cursor:pointer; margin-bottom:1rem; }
    .star-selector .star { transition:color .15s; color:var(--muted); }
    .review-textarea {
      width:100%; min-height:90px; padding:.75rem;
      background:var(--bg3); border:1px solid var(--border);
      border-radius:var(--radius); color:var(--cream);
      font-size:.9rem; resize:vertical; font-family:inherit;
      transition:border-color .2s;
    }
    .review-textarea:focus { outline:none; border-color:var(--gold); }
    .review-avg {
      display:flex; align-items:center; gap:.6rem;
      margin-bottom:1.2rem; padding:.8rem 1rem;
      background:var(--bg2); border-radius:var(--radius-lg);
      border:1px solid var(--border);
    }
    .review-avg .big-score {
      font-size:2.5rem; font-weight:700;
      color:var(--gold); line-height:1;
    }
  </style>
</head>

<body>
<div id="header-placeholder"></div>

<div class="section" style="padding-top:2rem" id="mainContent">
  <div class="loading"><div class="spinner"></div></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-prev"  onclick="event.stopPropagation();prevImg()">‹</button>
  <img id="lightboxImg" src="" alt=""/>
  <button class="lightbox-next"  onclick="event.stopPropagation();nextImg()">›</button>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script>
  renderHeader('products');
  renderFooter();

  const productId = new URLSearchParams(location.search).get('id');
  if (!productId) window.location.href = 'products.html';

  let galleryImages    = [];
  let currentImgIndex  = 0;

  // =============================================
  // LOAD SẢN PHẨM
  // =============================================
  async function loadProduct() {
    const content = document.getElementById('mainContent');
    try {
      const p = await Products.getById(productId);
      const finalPrice = p.price * (1 - (p.discount || 0) / 100);
      document.title = p.product_name + ' — Ascent-Music';

      // Xây dựng danh sách ảnh gallery
      galleryImages = [];
      if (p.image_url) galleryImages.push(p.image_url);
      if (p.images?.length) {
        p.images.forEach(img => {
          if (img.image_url && !galleryImages.includes(img.image_url))
            galleryImages.push(img.image_url);
        });
      }
      // Nếu chỉ có 1 ảnh, nhân lên 4 để hiện thumb
      if (galleryImages.length === 1) {
        galleryImages = [galleryImages[0], galleryImages[0], galleryImages[0], galleryImages[0]];
      }

      content.innerHTML = `
      <div class="detail-grid">

        <!-- GALLERY -->
        <div class="gallery-wrap">
          <div class="main-img-wrap" onclick="openLightbox(0)">
            ${galleryImages.length
              ? `<img src="${galleryImages[0]}" id="mainImg" alt="${p.product_name}"/>`
              : `<div class="main-img-placeholder">🎵</div>`}
          </div>
          ${galleryImages.length > 1 ? `
            <div class="thumb-list">
              ${galleryImages.map((img, i) => `
                <div class="thumb-item ${i === 0 ? 'active' : ''}" onclick="switchImg(${i})">
                  <img src="${img}" alt="thumb ${i + 1}"/>
                </div>`).join('')}
            </div>` : ''}
        </div>

        <!-- THÔNG TIN SẢN PHẨM -->
        <div class="detail-info">
          <div class="product-category">${p.category_name}</div>
          <h1 style="margin-bottom:.5rem">${p.product_name}</h1>
          <div style="margin-bottom:.8rem;color:var(--muted);font-size:.9rem">
            Thương hiệu: <span style="color:var(--cream);font-weight:500">${p.brand || '—'}</span>
          </div>

          <div class="detail-price">
            <span class="price-current">${formatPrice(finalPrice)}</span>
            ${p.discount > 0 ? `
              <span class="price-original">${formatPrice(p.price)}</span>
              <span style="background:var(--red);color:#fff;padding:.15rem .5rem;border-radius:4px;font-size:.8rem;font-weight:600">-${p.discount}%</span>` : ''}
          </div>

          <hr class="divider"/>

          ${p.description ? `<p style="margin-bottom:1.2rem;color:var(--muted);line-height:1.7">${p.description}</p>` : ''}

          <div style="margin-bottom:1rem;font-size:.88rem;color:var(--muted)">
            Tình trạng:
            <span style="color:${p.stock > 0 ? 'var(--green)' : 'var(--red)'};font-weight:600">
              ${p.stock > 0 ? `Còn hàng (${p.stock} sản phẩm)` : 'Hết hàng'}
            </span>
          </div>

          ${p.stock > 0 ? `
            <div style="display:flex;gap:1rem;margin-bottom:1.2rem;align-items:center">
              <div class="qty-selector">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <input type="number" class="qty-input" id="qtyInput" value="1" min="1" max="${p.stock}"/>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
              </div>
              <span style="font-size:.82rem;color:var(--muted)">Tối đa ${p.stock}</span>
            </div>
            <div class="detail-actions">
              <button class="btn btn-primary" style="flex:1" onclick="addToCart(${p.product_id})">
                🛒 Thêm vào giỏ
              </button>
              <button class="btn btn-outline" onclick="buyNow(${p.product_id})">
                ⚡ Mua ngay
              </button>
            </div>` : `
            <button class="btn btn-outline" disabled style="opacity:.5;cursor:not-allowed;width:100%">
              Hết hàng
            </button>`}
        </div>
      </div>

      <!-- ===== ĐÁNH GIÁ SẢN PHẨM ===== -->
      <div style="margin-top:3rem">
        <h3 style="font-size:1.3rem;margin-bottom:1.5rem">⭐ Đánh giá sản phẩm</h3>

        <!-- Form viết đánh giá (hiện nếu đã đăng nhập) -->
        <div id="reviewForm" class="review-form-wrap" style="display:none">
          <h4 style="margin-bottom:1rem;font-size:1rem;color:var(--cream)">✍️ Viết đánh giá của bạn</h4>
          <div style="margin-bottom:.5rem;font-size:.85rem;color:var(--muted)">Chọn số sao:</div>
          <div class="star-selector" id="starSelector">
            <span class="star" data-val="1">☆</span>
            <span class="star" data-val="2">☆</span>
            <span class="star" data-val="3">☆</span>
            <span class="star" data-val="4">☆</span>
            <span class="star" data-val="5">☆</span>
          </div>
          <input type="hidden" id="ratingInput" value="0"/>
          <textarea id="reviewComment" class="review-textarea" placeholder="Chia sẻ cảm nhận của bạn về sản phẩm..."></textarea>
          <div style="display:flex;gap:.8rem;margin-top:.8rem">
            <button class="btn btn-primary btn-sm" onclick="submitReview()">Gửi đánh giá</button>
            <button class="btn btn-outline btn-sm" onclick="resetReviewForm()">Đặt lại</button>
          </div>
        </div>

        <!-- Danh sách đánh giá -->
        <div id="reviewsList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- ===== SẢN PHẨM LIÊN QUAN ===== -->
      <div style="margin-top:3rem">
        <h3 style="font-size:1.3rem;margin-bottom:1.5rem">🎵 Sản phẩm liên quan</h3>
        <div class="products-grid" id="relatedGrid">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
      `;

      // Load song song để nhanh hơn
      loadRelated(p.category_id, p.product_id);
      loadReviews(productId);
      setupReviewForm();

    } catch(e) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="icon">😕</div>
          <h3>Không tìm thấy sản phẩm</h3>
          <a href="products.html" class="btn btn-outline" style="margin-top:1rem">← Quay lại</a>
        </div>`;
    }
  }

  // =============================================
  // ĐÁNH GIÁ — LOAD
  // =============================================
  async function loadReviews(pid) {
    try {
      const { reviews, average, total } = await Reviews.getByProduct(pid);
      const user = Auth.getUser();
      const box  = document.getElementById('reviewsList');
      if (!box) return;

      // Phần điểm trung bình
      const avgHTML = total > 0 ? `
        <div class="review-avg">
          <div class="big-score">${average}</div>
          <div>
            <div style="color:var(--gold);font-size:1.1rem;line-height:1">
              ${'★'.repeat(Math.round(average))}${'☆'.repeat(5 - Math.round(average))}
            </div>
            <div style="font-size:.8rem;color:var(--muted);margin-top:.2rem">
              ${total} đánh giá
            </div>
          </div>
        </div>` : '';

      // Danh sách đánh giá
      const listHTML = reviews.length
        ? reviews.map(r => `
          <div class="review-card">
            <div class="review-author">
              <div class="review-avatar">${(r.full_name?.[0] || '?').toUpperCase()}</div>
              <div>
                <div style="font-weight:600;font-size:.9rem">${r.full_name}</div>
                <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
              </div>
              <div class="review-date" style="margin-left:auto">
                ${new Date(r.created_at).toLocaleDateString('vi-VN')}
              </div>
              ${user && (user.user_id === r.user_id || user.role === 'admin')
                ? `<button class="review-delete-btn" onclick="deleteReview(${r.review_id})" title="Xóa đánh giá">🗑</button>`
                : ''}
            </div>
            ${r.comment ? `<p class="review-text">${r.comment}</p>` : ''}
          </div>`).join('')
        : `<div class="empty-state">
            <div class="icon">💬</div>
            <p>Chưa có đánh giá nào. Hãy là người đầu tiên nhận xét!</p>
           </div>`;

      box.innerHTML = avgHTML + listHTML;

    } catch(e) { console.error('loadReviews:', e); }
  }

  // =============================================
  // ĐÁNH GIÁ — FORM
  // =============================================
  function setupReviewForm() {
    if (!Auth.isLoggedIn()) return;
    document.getElementById('reviewForm').style.display = 'block';

    let selectedRating = 0;
    document.querySelectorAll('#starSelector .star').forEach(star => {
      star.addEventListener('mouseover', () => highlightStars(star.dataset.val));
      star.addEventListener('mouseout',  () => highlightStars(selectedRating));
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.dataset.val);
        document.getElementById('ratingInput').value = selectedRating;
        highlightStars(selectedRating);
      });
    });
  }

  function highlightStars(val) {
    document.querySelectorAll('#starSelector .star').forEach((s, i) => {
      s.textContent = i < val ? '★' : '☆';
      s.style.color = i < val ? 'var(--gold)' : 'var(--muted)';
    });
  }

  function resetReviewForm() {
    document.getElementById('reviewComment').value = '';
    document.getElementById('ratingInput').value   = 0;
    highlightStars(0);
  }

  async function submitReview() {
    const rating  = parseInt(document.getElementById('ratingInput').value);
    const comment = document.getElementById('reviewComment').value.trim();

    if (!rating) { showToast('Vui lòng chọn số sao!', 'error'); return; }

    try {
      await Reviews.create({ product_id: productId, rating, comment });
      showToast('Cảm ơn bạn đã đánh giá! 🎵', 'success');
      resetReviewForm();
      loadReviews(productId);
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function deleteReview(id) {
    if (!confirm('Xóa đánh giá này?')) return;
    try {
      await Reviews.delete(id);
      showToast('Đã xóa đánh giá!', 'success');
      loadReviews(productId);
    } catch(e) { showToast(e.message, 'error'); }
  }

  // =============================================
  // GALLERY
  // =============================================
  function switchImg(index) {
    currentImgIndex = index;
    document.getElementById('mainImg').src = galleryImages[index];
    document.querySelectorAll('.thumb-item').forEach((el, i) => {
      el.classList.toggle('active', i === index);
    });
  }

  function openLightbox(index) {
    currentImgIndex = index;
    document.getElementById('lightboxImg').src = galleryImages[index];
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLightbox(e) {
    if (e && e.target !== e.currentTarget && e.target.id !== 'lightbox') return;
    document.getElementById('lightbox').classList.remove('open');
  }

  function prevImg() {
    currentImgIndex = (currentImgIndex - 1 + galleryImages.length) % galleryImages.length;
    document.getElementById('lightboxImg').src = galleryImages[currentImgIndex];
  }

  function nextImg() {
    currentImgIndex = (currentImgIndex + 1) % galleryImages.length;
    document.getElementById('lightboxImg').src = galleryImages[currentImgIndex];
  }

  // Phím mũi tên để điều hướng lightbox
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowLeft')  prevImg();
    if (e.key === 'ArrowRight') nextImg();
    if (e.key === 'Escape')     closeLightbox({target: document.getElementById('lightbox'), currentTarget: document.getElementById('lightbox')});
  });

  // =============================================
  // SỐ LƯỢNG
  // =============================================
  function changeQty(delta) {
    const inp = document.getElementById('qtyInput');
    let val   = parseInt(inp.value) + delta;
    if (val < 1)                   val = 1;
    if (val > parseInt(inp.max))   val = parseInt(inp.max);
    inp.value = val;
  }

  // =============================================
  // GIỎ HÀNG
  // =============================================
  async function addToCart(product_id) {
    if (!Auth.isLoggedIn()) {
      showToast('Vui lòng đăng nhập để mua hàng!', 'error');
      return;
    }
    const qty = parseInt(document.getElementById('qtyInput').value);
    try {
      await Cart.add(product_id, qty);
      showToast('Đã thêm vào giỏ hàng! 🛒', 'success');
      updateCartBadge();
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function buyNow(product_id) {
    await addToCart(product_id);
    setTimeout(() => { location.href = 'cart.html'; }, 700);
  }

  // =============================================
  // SẢN PHẨM LIÊN QUAN
  // =============================================
  async function loadRelated(categoryId, excludeId) {
    try {
      const { products } = await Products.getAll({ category_id: categoryId, limit: 5 });
      const filtered = products.filter(p => p.product_id != excludeId).slice(0, 4);
      const grid = document.getElementById('relatedGrid');
      if (!grid) return;

      grid.innerHTML = filtered.length
        ? filtered.map(p => {
            const fp = p.price * (1 - (p.discount || 0) / 100);
            return `
              <div class="product-card">
                <a href="product-detail.html?id=${p.product_id}">
                  <div class="product-img">
                    <img src="${p.image_url}" alt="${p.product_name}" onerror="this.parentElement.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;height:100%;font-size:3rem;opacity:.3\'>🎵</div>'"/>
                  </div>
                </a>
                <div class="product-body">
                  <div class="product-name">${p.product_name}</div>
                  <div class="product-price">${formatPrice(fp)}</div>
                </div>
              </div>`;
          }).join('')
        : `<p style="color:var(--muted)">Không có sản phẩm liên quan.</p>`;

    } catch(e) { console.error('loadRelated:', e); }
  }

  // =============================================
  // KHỞI ĐỘNG
  // =============================================
  loadProduct();
</script>
</body>
</html>
