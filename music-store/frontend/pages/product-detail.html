<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chi tiết sản phẩm — Ascent-Music</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    /* GALLERY */
    .gallery-wrap { display:flex; flex-direction:column; gap:0.8rem; }

    .main-img-wrap {
      aspect-ratio: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      cursor: zoom-in;
    }
    .main-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .main-img-wrap:hover img { transform: scale(1.04); }
    .main-img-placeholder {
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      font-size:5rem; opacity:0.2;
    }

    /* THUMBNAILS */
    .thumb-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }
    .thumb-item {
      aspect-ratio: 1;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      background: var(--bg3);
      transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-item img { width:100%; height:100%; object-fit:cover; }
    .thumb-item:hover { border-color: rgba(201,168,76,0.5); }
    .thumb-item.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,168,76,0.2); }
    .thumb-placeholder { font-size:1.5rem; opacity:0.3; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: var(--radius-lg);
    }
    .lightbox-close {
      position: fixed; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.1); border: none;
      color: #fff; font-size: 1.5rem;
      width: 44px; height: 44px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.2); }
    .lightbox-prev, .lightbox-next {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none;
      color: #fff; font-size: 1.5rem;
      width: 48px; height: 48px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }
    .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>

<div id="header-placeholder"></div>

<div class="section" style="padding-top:2rem" id="mainContent">
  <div class="loading"><div class="spinner"></div></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-prev" onclick="event.stopPropagation();prevImg()">‹</button>
  <img id="lightboxImg" src="" alt=""/>
  <button class="lightbox-next" onclick="event.stopPropagation();nextImg()">›</button>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script>
  renderHeader('products');
  renderFooter();

  const productId = new URLSearchParams(location.search).get('id');
  if (!productId) window.location.href = 'products.html';

  let galleryImages = [];
  let currentImgIndex = 0;

  async function loadProduct() {
    const content = document.getElementById('mainContent');
    try {
      const p = await Products.getById(productId);
      const finalPrice = p.price * (1 - (p.discount||0) / 100);
      document.title = p.product_name + ' — Ascent-Music';

      // Gom tất cả ảnh: ảnh chính + ảnh phụ
      galleryImages = [];
      if (p.image_url) galleryImages.push(p.image_url);
      if (p.images && p.images.length) {
        p.images.forEach(img => {
          if (img.image_url && !galleryImages.includes(img.image_url)) {
            galleryImages.push(img.image_url);
          }
        });
      }
      // Nếu chỉ có 1 ảnh, tạo 3 ảnh giống nhau để demo thumbnail
      if (galleryImages.length === 1) {
        galleryImages = [galleryImages[0], galleryImages[0], galleryImages[0], galleryImages[0]];
      }

      content.innerHTML = `
      <!-- BREADCRUMB -->
      <div style="font-size:0.82rem;color:var(--muted);margin-bottom:1.5rem">
        <a href="../index.html" style="color:var(--muted)">Trang chủ</a> /
        <a href="products.html?category_id=${p.category_id}" style="color:var(--muted)">${p.category_name}</a> /
        <span style="color:var(--cream)">${p.product_name}</span>
      </div>

      <div class="detail-grid">
        <!-- ẢNH GALLERY -->
        <div class="gallery-wrap">
          <!-- ẢNH LỚN -->
          <div class="main-img-wrap" onclick="openLightbox(0)" id="mainImgWrap">
            ${galleryImages.length
              ? `<img src="${galleryImages[0]}" alt="${p.product_name}" id="mainImg"
                   onerror="this.parentElement.innerHTML='<div class=main-img-placeholder>🎵</div>'"/>`
              : `<div class="main-img-placeholder">🎵</div>`}
          </div>

          <!-- THUMBNAILS -->
          ${galleryImages.length > 1 ? `
          <div class="thumb-list" id="thumbList">
            ${galleryImages.map((img, i) => `
              <div class="thumb-item ${i===0?'active':''}" id="thumb-${i}" onclick="switchImg(${i})">
                <img src="${img}" alt="Ảnh ${i+1}"
                  onerror="this.parentElement.innerHTML='<span class=thumb-placeholder>🎵</span>'"/>
              </div>`).join('')}
          </div>` : ''}
        </div>

        <!-- THÔNG TIN SẢN PHẨM -->
        <div class="detail-info">
          <div class="product-category">${p.category_name}</div>
          <h1 style="font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;margin-bottom:0.5rem;line-height:1.2">${p.product_name}</h1>

          <div style="display:flex;align-items:center;gap:1rem;margin:0.5rem 0">
            <span style="color:var(--muted);font-size:0.88rem">Thương hiệu: <strong style="color:var(--cream)">${p.brand||'—'}</strong></span>
            <span class="stock-badge ${p.stock>0?'stock-in':'stock-out'}">
              ${p.stock>0 ? `✓ Còn hàng (${p.stock})` : '✕ Hết hàng'}
            </span>
          </div>

          <!-- GIÁ -->
          <div class="detail-price">
            <span class="price-current">${formatPrice(finalPrice)}</span>
            ${p.discount > 0 ? `
              <span class="price-original">${formatPrice(p.price)}</span>
              <span style="background:rgba(224,85,85,0.12);color:var(--red);font-size:0.8rem;padding:0.2rem 0.6rem;border-radius:999px;font-weight:600">-${p.discount}%</span>` : ''}
          </div>

          <hr class="divider"/>

          ${p.description ? `<p style="font-size:0.92rem;color:var(--muted);line-height:1.7;margin-bottom:1.2rem">${p.description}</p>` : ''}

          <div class="specs" style="margin-bottom:1.5rem">
            <div class="spec-item"><span class="spec-label">Danh mục</span><span class="spec-value">${p.category_name}</span></div>
            <div class="spec-item"><span class="spec-label">Thương hiệu</span><span class="spec-value">${p.brand||'—'}</span></div>
            <div class="spec-item"><span class="spec-label">Tình trạng</span><span class="spec-value" style="color:${p.stock>0?'var(--green)':'var(--red)'}">${p.stock>0?'Còn hàng':'Hết hàng'}</span></div>
            <div class="spec-item"><span class="spec-label">Tồn kho</span><span class="spec-value">${p.stock} sản phẩm</span></div>
          </div>

          ${p.stock > 0 ? `
          <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem">
            <span style="font-size:0.85rem;color:var(--muted)">Số lượng:</span>
            <div class="qty-selector">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <input type="number" class="qty-input" id="qtyInput" value="1" min="1" max="${p.stock}"/>
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
          </div>
          <div class="detail-actions">
            <button class="btn btn-primary" style="flex:1" onclick="addToCart(${p.product_id},'${p.product_name.replace(/'/g,"\\'")}',${p.stock})">
              🛒 Thêm vào giỏ hàng
            </button>
            <button class="btn btn-outline" onclick="buyNow(${p.product_id},'${p.product_name.replace(/'/g,"\\'")}',${p.stock})">
              ⚡ Mua ngay
            </button>
          </div>` : `
          <div style="background:rgba(224,85,85,0.08);border:1px solid rgba(224,85,85,0.2);border-radius:var(--radius);padding:1rem;text-align:center;color:var(--red)">
            Sản phẩm tạm hết hàng
          </div>`}
        </div>
      </div>

      <!-- ĐÁNH GIÁ -->
      <div style="margin-top:3rem">
        <h3 style="font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:1.5rem">Đánh giá sản phẩm</h3>
        ${p.reviews?.length ? p.reviews.map(r => `
          <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem;margin-bottom:0.8rem">
            <div style="display:flex;align-items:center;gap:0.8rem;margin-bottom:0.5rem">
              <div style="width:34px;height:34px;border-radius:50%;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--gold-light)">${r.full_name?.[0]?.toUpperCase()}</div>
              <div>
                <div style="font-weight:500;font-size:0.88rem">${r.full_name}</div>
                <div style="color:var(--gold);font-size:0.85rem">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
              </div>
              <div style="margin-left:auto;font-size:0.78rem;color:var(--muted)">${new Date(r.created_at).toLocaleDateString('vi-VN')}</div>
            </div>
            <p style="font-size:0.88rem;color:var(--muted)">${r.comment||''}</p>
          </div>`).join('') : `
          <div class="empty-state"><div class="icon">💬</div><p>Chưa có đánh giá nào</p></div>`}
      </div>

      <!-- SẢN PHẨM LIÊN QUAN -->
      <div style="margin-top:3rem">
        <h3 style="font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:1.5rem">Sản phẩm liên quan</h3>
        <div class="products-grid" id="relatedGrid"><div class="loading"><div class="spinner"></div></div></div>
      </div>`;

      loadRelated(p.category_id, p.product_id);
    } catch(e) {
      content.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Không tìm thấy sản phẩm</h3><a href="products.html" class="btn btn-primary" style="margin-top:1rem">Quay lại</a></div>`;
    }
  }

  // ĐỔI ẢNH KHI BẤM THUMBNAIL
  function switchImg(index) {
    currentImgIndex = index;
    const mainImg = document.getElementById('mainImg');
    if (mainImg) {
      mainImg.style.opacity = '0';
      mainImg.style.transition = 'opacity 0.2s';
      setTimeout(() => {
        mainImg.src = galleryImages[index];
        mainImg.style.opacity = '1';
      }, 150);
    }
    // Active thumbnail
    document.querySelectorAll('.thumb-item').forEach((el, i) => {
      el.classList.toggle('active', i === index);
    });
  }

  // LIGHTBOX
  function openLightbox(index) {
    currentImgIndex = index;
    document.getElementById('lightboxImg').src = galleryImages[index];
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(e) {
    if (e && e.target !== document.getElementById('lightbox') && e.target !== document.querySelector('.lightbox-close')) return;
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  function prevImg() {
    currentImgIndex = (currentImgIndex - 1 + galleryImages.length) % galleryImages.length;
    document.getElementById('lightboxImg').src = galleryImages[currentImgIndex];
  }
  function nextImg() {
    currentImgIndex = (currentImgIndex + 1) % galleryImages.length;
    document.getElementById('lightboxImg').src = galleryImages[currentImgIndex];
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape')    { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow=''; }
    if (e.key === 'ArrowLeft') prevImg();
    if (e.key === 'ArrowRight') nextImg();
  });

  async function loadRelated(categoryId, excludeId) {
    try {
      const { products } = await Products.getAll({ category_id: categoryId, limit: 4 });
      const filtered = products.filter(p => p.product_id != excludeId).slice(0, 4);
      document.getElementById('relatedGrid').innerHTML = filtered.map(p => {
        const fp = p.price * (1 - (p.discount||0) / 100);
        return `
        <div class="product-card">
          <a href="product-detail.html?id=${p.product_id}">
            <div class="product-img">
              ${p.image_url ? `<img src="${p.image_url}" alt="${p.product_name}" onerror="this.parentElement.innerHTML='<div class=placeholder>🎵</div>'"/>` : `<div class="placeholder">🎵</div>`}
            </div>
          </a>
          <div class="product-body">
            <div class="product-name"><a href="product-detail.html?id=${p.product_id}">${p.product_name}</a></div>
            <div class="product-price"><span class="price-current">${formatPrice(fp)}</span></div>
          </div>
          <div class="product-footer">
            <a href="product-detail.html?id=${p.product_id}" class="btn btn-primary btn-sm btn-block">Xem chi tiết</a>
          </div>
        </div>`;
      }).join('');
    } catch {}
  }

  function changeQty(delta) {
    const inp = document.getElementById('qtyInput');
    let val = parseInt(inp.value) + delta;
    if (val < 1) val = 1;
    if (val > parseInt(inp.max)) val = parseInt(inp.max);
    inp.value = val;
  }

  async function addToCart(product_id, name, stock) {
    if (!Auth.isLoggedIn()) {
      showToast('Vui lòng đăng nhập!', 'error');
      setTimeout(() => window.location.href = 'login.html?redirect=' + encodeURIComponent(location.href), 1000);
      return;
    }
    const qty = parseInt(document.getElementById('qtyInput')?.value || 1);
    try {
      await Cart.add(product_id, qty);
      showToast('Đã thêm vào giỏ hàng!', 'success');
      updateCartBadge();
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function buyNow(product_id, name, stock) {
    await addToCart(product_id, name, stock);
    setTimeout(() => window.location.href = 'cart.html', 800);
  }

  loadProduct();
</script>
</body>
</html>
